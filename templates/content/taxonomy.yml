# den-wiki taxonomy. Pages use only the types, tags and topics listed here;
# add one here before using it. Format: den-wiki schemas/taxonomy.schema.json.
version: 1

types:
  - name: concept
    description: An idea, technique or pattern, explained on its own terms.
  - name: entity
    description: A specific thing - a project, tool, organisation, paper or person.
  - name: comparison
    description: Two or more concepts or entities set side by side.
  - name: synthesis
    description: A conclusion drawn across several pages and sources.
  - name: hub
    description: A map page that links the pages of one area.

tags:
  - name: meta
    description: Pages about den-wiki itself - its contract, curation and tooling.
  - name: software
    description: Software, libraries, services and how they are built.
  - name: ai
    description: AI models, agents and their tooling.
    parent: software
  - name: games
    description: Game design, game engines and game tooling.
  - name: research-method
    description: How to research - search methods, source assessment, provenance.

# Topics sort pages for readers: each page names exactly one, the most
# specific that fits. Tags cut across topics.
topics:
  - name: home
    description: The house and household - appliances, repairs, garden, local services.
  - name: dev
    description: Software development in general - languages, libraries, tools and practice.
  - name: gamedev
    description: Game design, game engines and game tooling in general.
    parent: dev
  - name: infrastructure
    description: Servers, networking, self-hosting and backups in general.
    parent: dev
  - name: projects
    description: Our own projects - Den, den-wiki, the games being built, the homelab as set up.
  - name: world
    description: News and current affairs.
  - name: geopolitics
    description: Wars, states and international relations.
    parent: world
  - name: economics
    description: Economics, markets and finance.
    parent: world
