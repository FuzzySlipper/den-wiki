# den-wiki serve configuration in the den-wiki container (CT 108).
# Installed as /etc/den-wiki/den-wiki.yml by deploy/provision.sh.
listen: 192.168.1.13:7341
database: /var/lib/den-wiki/den-wiki.db
content_dir: /srv/den-wiki-content
openknowledge:
  url: http://127.0.0.1:4800/mcp
  timeout: 30s
# Video and very large files, outside git: the den-nas share bind-mounted
# into the container (docs/deployment.md, Media store).
media:
  dir: /srv/den-wiki-media
  git_max_bytes: 52428800
ui_commits:
  author: ui
  interval: 30s
  quiet: 60s
