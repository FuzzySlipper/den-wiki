#!/usr/sbin/nft -f
# den-wiki container firewall, installed as /etc/nftables.conf. OpenKnowledge
# (4800) and the den-wiki service (7341) take connections only from loopback
# and Caddy (CT 104, 192.168.1.6), so Caddy is the only way in from the LAN.
flush ruleset

table inet filter {
	chain input {
		type filter hook input priority 0; policy accept;
		iif lo accept
		tcp dport { 4800, 7341 } ip saddr 192.168.1.6 accept
		tcp dport { 4800, 7341 } drop
	}
}
