# den-wiki serve configuration (den-wiki serve --config <this file>).
# Relative paths resolve against this file's directory. Unknown keys are errors.

# Loopback or private-LAN address only: den-wiki has no auth of its own.
listen: 127.0.0.1:7341

# SQLite file for the research ledger and the read log.
database: /var/lib/den-wiki/den-wiki.db

# The den-wiki-content checkout that OpenKnowledge serves. It enables the
# wiki tools' commits, wiki_lint and job_finish's trail-page check.
content_dir: /srv/den-wiki-content

openknowledge:
  # OK's MCP endpoint, on loopback beside the facade. Empty disables the wiki tools.
  url: http://127.0.0.1:4800/mcp
  timeout: 30s

# The media store: files wiki_attach keeps out of git (video, and anything
# over git_max_bytes), served at /media/<sha256>.<ext>. The directory must
# exist; den-wiki refuses to start rather than fill a directory under a
# missing mount. Empty dir disables the store (video cannot be attached).
media:
  dir: /srv/den-wiki-media
  git_max_bytes: 52428800   # 50 MiB; video always goes to the store

# Background commits of content changes that did not come through the facade:
# edits in OK's web UI, pages its editor re-saved when viewed, and facade
# writes whose own commit failed. Needs content_dir. See docs/facade.md.
ui_commits:
  disabled: false
  author: ui        # git author of UI commits
  interval: 30s     # how often to look for changes
  quiet: 60s        # how long a file must go unchanged before it is committed
